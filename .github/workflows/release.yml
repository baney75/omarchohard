name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tests/container/run.sh all

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build stable
        run: scripts/build-release.sh stable dist
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$(cat VERSION)" >notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/omarchohard.tar.gz dist/omarchohard.tar.gz.sha256 dist/omarchohard.version \
            --title "omarchohard $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
