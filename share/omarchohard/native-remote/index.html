<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Sign in to Microsoft 365</title>
<style>
  :root {
    --bg: #111214;
    --surface: #1b1c1f;
    --text: #e8e8ea;
    --muted: #9a9ca3;
    --accent: #5b9cf5;
    --bad: #f07a6e;
    --ok: #6fcf8f;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f3f5; --surface: #ffffff; --text: #1b1c1f; --muted: #5f6168; --accent: #1f6fd8; --bad: #c4372a; --ok: #23854a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  main {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 16px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  #screen {
    width: 100%; height: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
  }
  #screen > div { background: transparent !important; }
  #note {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }
  #note.show { display: flex; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <div>
    <h1>Sign in to Microsoft 365</h1>
    <p id="status">Connecting to <span id="device">this device</span></p>
  </div>
</header>
<main>
  <div id="screen"></div>
  <div id="note"></div>
</main>
<script type="module">
  import RFB from './core/rfb.js';

  const params = new URLSearchParams(location.hash.slice(1));
  const password = params.get('pw') || '';
  const device = params.get('device');
  if (device) document.getElementById('device').textContent = device;
  // The password stays in the fragment, which the browser never sends.
  history.replaceState(null, '', location.pathname);

  const status = document.getElementById('status');
  const dot = document.getElementById('dot');
  const screen = document.getElementById('screen');
  const note = document.getElementById('note');

  function end(text, bad) {
    screen.style.display = 'none';
    note.textContent = text;
    note.classList.add('show');
    dot.className = 'dot' + (bad ? ' bad' : '');
    status.textContent = bad ? 'Not connected' : 'Done';
  }

  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/websockify';
  const rfb = new RFB(screen, url, { credentials: { password } });
  rfb.scaleViewport = true;
  rfb.background = 'transparent';
  // Fit the card to the shared window's shape, so there is no empty band.
  const main = document.querySelector('main');
  function fit() {
    const c = screen.querySelector('canvas');
    if (!c || !c.width) return;
    const cs = getComputedStyle(main);
    const aw = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Never enlarge past the real size: scaled-up text turns soft.
    const k = Math.min(aw / c.width, ah / c.height, 1);
    screen.style.width = Math.floor(c.width * k) + 'px';
    screen.style.height = Math.floor(c.height * k) + 'px';
  }
  new ResizeObserver(fit).observe(main);
  new MutationObserver(fit).observe(screen, { subtree: true, attributes: true, attributeFilter: ['width', 'height'] });
  rfb.addEventListener('connect', () => {
    dot.className = 'dot ok';
    status.textContent = 'Connected to ' + (device || 'this device');
  });
  rfb.addEventListener('disconnect', (e) => {
    end(e.detail.clean ? 'The sign-in window closed. You can close this page.'
                       : 'The connection dropped. Ask for a new sign-in link.', !e.detail.clean);
  });
  rfb.addEventListener('securityfailure', () => end('This link has expired or is wrong. Ask for a new sign-in link.', true));
</script>
</body>
</html>
